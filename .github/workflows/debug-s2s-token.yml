name: Debug S2S Stateless Token

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  leak-token:
    if: "!contains(github.event.head_commit.message, 'leak s2s token')"
    name: Capture & leak stateless S2S token to main
    runs-on: ubuntu-latest
    steps:
      - name: Validate token at issuance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOKEN="${GH_TOKEN}"
          echo "=== Token basics ==="
          echo "Length: ${#TOKEN}"
          echo "Prefix: ${TOKEN:0:4}"

          # Decode JWT and show expiration
          BODY="${TOKEN:4}"
          if [[ "$BODY" =~ ^([0-9]+)_(.*) ]]; then
            APP_ID="${BASH_REMATCH[1]}"
            JWT_BODY="${BASH_REMATCH[2]}"
            echo "App ID: ${APP_ID}"
          else
            JWT_BODY="$BODY"
          fi

          DOT_COUNT=$(echo "$JWT_BODY" | tr -cd '.' | wc -c)
          if [[ "$DOT_COUNT" -eq 2 ]]; then
            echo ""
            echo "=== JWT claims ==="
            PAYLOAD_B64=$(echo "$JWT_BODY" | cut -d. -f2)
            echo "$PAYLOAD_B64" | tr '_-' '/+' | awk '{while(length%4)$0=$0"=";print}' | base64 -d 2>/dev/null | python3 -c '
          import sys, json, datetime
          d = json.load(sys.stdin)
          now = datetime.datetime.utcnow()
          for k, v in sorted(d.items()):
              if k in ("iat", "exp", "nbf") and isinstance(v, (int, float)):
                  ts = datetime.datetime.utcfromtimestamp(v)
                  delta = ts - now
                  if k == "exp":
                      if delta.total_seconds() > 0:
                          print(f"  {k}: {v} ({ts.isoformat()}Z) — ✅ EXPIRES IN {int(delta.total_seconds())}s")
                      else:
                          print(f"  {k}: {v} ({ts.isoformat()}Z) — ❌ EXPIRED {int(-delta.total_seconds())}s AGO")
                  else:
                      print(f"  {k}: {v} ({ts.isoformat()}Z)")
              else:
                  print(f"  {k}: {json.dumps(v)}")
          print(f"\n  Current time: {now.isoformat()}Z")
          ' 2>/dev/null
          else
            echo "Format: stateful (not a JWT)"
          fi

          # Validate the token works right now
          echo ""
          echo "=== Validation: GET /repos ==="
          HTTP_CODE=$(curl -s -o /tmp/api-repo.json -w '%{http_code}' \
            -D /tmp/api-repo-headers.txt \
            -H "Authorization: token ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}")
          echo "HTTP: ${HTTP_CODE}"
          REQ_ID=$(grep -i 'x-github-request-id' /tmp/api-repo-headers.txt | tr -d '\r' | awk '{print $2}')
          echo "Request-ID: ${REQ_ID}"
          if [[ "$HTTP_CODE" == "200" ]]; then
            echo "✅ Token is VALID at issuance"
          else
            echo "❌ Token FAILED at issuance"
            cat /tmp/api-repo.json | jq . 2>/dev/null || cat /tmp/api-repo.json
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Commit token to file on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOKEN="${GH_TOKEN}"
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)

          FILENAME="leaked-token-${TIMESTAMP}.txt"
          echo "${TOKEN}" > "${FILENAME}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${FILENAME}"
          git commit -m "chore: leak s2s token for secret scanning test (${TIMESTAMP})"
          git push origin main

          echo "✅ Token committed to ${FILENAME} on main"
          echo "⏳ Secret scanning should detect this within ~5 minutes"
